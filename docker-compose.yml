version: '3.8'

services:
  app:
    build: .
    ports:
      - "7860:7860"
    env_file:
      - .env
    environment:
      - MODE=app
      - ENVIRONMENT=production
    volumes:
      - ./logs:/app/logs
      - ./.model_cache:/app/.model_cache
    restart: unless-stopped

  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - MODE=api
      - ENVIRONMENT=production
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped

  worker:
    build: .
    env_file:
      - .env
    environment:
      - MODE=worker
      - ENVIRONMENT=production
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped
